name: Android Mobile CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Source credential gate
        run: python3 scripts/scan-source-secrets.py
      - name: Build, test and lint mobile only
        run: ./gradlew --no-daemon :app:assembleMobileDebug :app:testMobileDebugUnitTest :app:lintMobileDebug :app:writeMobileDependencyInventory
      - name: Native compatibility release blocker
        run: python3 scripts/check-native-alignment.py
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-quality-reports
          path: |
            app/build/reports/
            app/build/test-results/

